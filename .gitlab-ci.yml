# Two stages run in order: test first, then build. If test fails, build never starts.
stages:
  - test
  - build

# Run the pipeline on every push to any branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# Test job: runs the unit tests. No credentials or network needed, because Gemini is mocked.
test:
  stage: test
  image: python:3.12-slim          # a clean Python environment for this job
  rules:
    - when: always                 # run on every pipeline
  script:
    - pip install poetry           # Poetry reads pyproject.toml and poetry.lock
    - poetry config virtualenvs.create false   # install into the image itself, no extra venv
    - poetry install --no-root     # install the app's dependencies (the app is not a package)
    - poetry run pytest            # run tests/; a failing test fails the job

# Build job: proves the Dockerfile builds. It does not push the image anywhere and uses no GCP.
build:
  stage: build
  image: docker:27                 # the Docker command-line client
  services:
    - docker:27-dind               # a Docker engine the client talks to (Docker-in-Docker)
  variables:
    DOCKER_TLS_CERTDIR: "/certs"   # lets the client and engine talk over TLS
  rules:
    - when: on_success             # run only if the test stage passed
  script:
    - docker build -t story_polisher:$CI_COMMIT_SHORT_SHA .   # build, tagged with the commit
